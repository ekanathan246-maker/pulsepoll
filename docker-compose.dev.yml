# Development override: publishes non-standard host ports so the services can
# be developed natively on the host without colliding with anything already
# running (e.g. other projects using 8080/6379/27017).
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
services:
  redis:
    ports:
      - "6390:6379"
  mongo:
    ports:
      - "27019:27017"
  backend:
    ports:
      - "8082:8080"