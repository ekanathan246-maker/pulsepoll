services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      PORT: "8080"
      ENV: "development"
      MONGO_URI: "mongodb://mongo:27017"
      MONGO_DB: "pulsepoll"
      REDIS_ADDR: "redis:6379"
      JWT_SECRET: "local-dev-secret"
      FRONTEND_ORIGINS: "http://localhost:5173,http://localhost"
      PUBLIC_URL: "${PUBLIC_URL:-}"
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  redis-data:
  mongo-data: