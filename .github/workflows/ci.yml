name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.1
          cache-dependency-path: backend/go.sum
      - run: go test -race ./...
      - run: go vet ./...
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
      - name: Validate OpenAPI contract
        run: npx --yes @redocly/cli@2.53.3 lint docs/openapi.yaml
        working-directory: .

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.1
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: docker compose up -d --build
      - name: Wait for readiness
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost/api/readyz; then exit 0; fi
            sleep 2
          done
          docker compose logs
          exit 1
      - run: go test -tags=integration ./tests -count=1 -v
        working-directory: backend
      - name: Prove Redis outage recovery
        run: bash scripts/redis-failure-drill.sh
      - name: Browser flows (desktop and mobile)
        run: npm run test:e2e
        working-directory: frontend
      - name: Build and verify non-root release image
        run: |
          docker build -f deploy/combined.Dockerfile -t pulsepoll-release .
          test "$(docker image inspect pulsepoll-release --format '{{.Config.User}}')" = "101:101"
      - if: always()
        run: docker compose logs --no-color > compose.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-evidence
          path: |
            compose.log
            frontend/test-results
